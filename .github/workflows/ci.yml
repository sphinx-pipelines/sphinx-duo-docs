name: Continuous Integration - Remote Docs Compilation - Split Repos

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the independent documentation repository into a dedicated workspace directory:
      - name: Checkout Documentation
        uses: actions/checkout@v4
        with:
          path: sphinx-sandbox-docs

      # 2. Checkout the independent code repository into a dedicated parallel sibling workspace directory:
      - name: Checkout Sibling Code
        uses: actions/checkout@v4
        with:
          repository: sphinx-pipeline-sandbox/sphinx-sandbox-code
          path: sphinx-sandbox-code

      # 3. Provide a clean, predictable Python execution-environment:
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Upgrade package managers and fetch necessary documentation engines:
      - name: Install Sphinx Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme

      # 5. Move into the documentation directory and run the build script:
      - name: Compile Sphinx Documentation
        run: |
          cd sphinx-sandbox-docs/docs
          chmod +x build_local.sh
          ./build_local.sh

      # 6. Run validation checks to make sure the sibling code imports and runs without errors:
      - name: Execute Runtime Integrity Checks
        run: |
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}/sphinx-sandbox-code"
          python -c "from codebase.example import Circle; c = Circle(5); assert c.get_area() > 0"
          echo "All structural runtime-checks passed successfully!"
